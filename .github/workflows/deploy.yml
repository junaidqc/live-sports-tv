name: Deploy Live Sports TV

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install Server Dependencies
        run: cd server && (npm ci || npm install)

      - name: Install Client Dependencies
        run: cd client && (npm ci || npm install)

      - name: Start Server in Background for E2E Tests
        run: |
          node server/index.js &
          sleep 3

      - name: Run Automated Test Suite
        run: npm test

      - name: Build Client for GitHub Pages
        run: |
          cd client
          npm run build
        env:
          VITE_BASE_PATH: /live-sports-tv/

      - name: Copy 404 for SPA Routing on GitHub Pages
        run: cp client/dist/index.html client/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'client/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
